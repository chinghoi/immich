name: Tailnet iOS
on:
  push:
    branches: ['ios/tailscale', 'ios/stable', 'sync/tailnet-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tailnet-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify cloud toolchain
        run: |
          sw_vers
          xcodebuild -version
          ls /Applications | sort
